.btn:hover,.btn:focus-visible{background:linear-gradient(135deg,var(--g1),var(--g2) 55%,var(--g3));color:#20140a;box-shadow:0 0 24px #f0c15a77;outline:none}
.btn:active{transform:scale(.98)}

.back{background:none;border:0;color:var(--g2);font:inherit;font-size:15px;margin-top:10px;padding:8px;cursor:pointer}
[dir=rtl] .btn{flex-direction:row-reverse}

.btn,.back,.mgr b{animation:bob 2.4s ease-in-out infinite}
