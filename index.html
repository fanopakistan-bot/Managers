<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Fano Group Chat</title>
<style>
:root{--g1:#fff1b8;--g2:#f0c15a;--g3:#b98524;--ink:#fff8e6}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:Georgia,"Palatino Linotype","Noto Nastaliq Urdu","Noto Naskh Arabic","Songti SC","Microsoft YaHei",serif;color:var(--ink);background:#0a1230;overflow:hidden}
/* BACKGROUND IMAGE: replace the gradient below with your original  background:url(data:image/jpeg;base64,...) center top/cover no-repeat  */
.bg{position:fixed;inset:-4%;background:radial-gradient(ellipse at 50% 20%,#1d3a8a 0%,#0e1a45 45%,#070d26 100%);animation:drift 22s ease-in-out infinite alternate;will-change:transform}
@keyframes drift{to{transform:scale(1.07) translateY(-1.5%)}}
.veil{position:fixed;inset:0;background:linear-gradient(180deg,#0a123000 0%,#0a123000 28%,#0a1230aa 55%,#070d26ee 100%)}
main{position:relative;height:100%;display:flex;align-items:flex-end;justify-content:center;padding:0 16px calc(env(safe-area-inset-bottom) + 6vh)}
.panel{width:100%;max-width:400px;text-align:center;padding:30px 22px 22px;border-radius:18px;background:linear-gradient(170deg,#0e1a45ee,#070d26f2);border:1px solid #f0c15a99;box-shadow:0 24px 60px #000a,0 0 0 5px #f0c15a14,inset 0 0 40px #f0c15a0f;position:relative}
.panel:before{content:"";position:absolute;inset:6px;border:1px solid #f0c15a33;border-radius:13px;pointer-events:none}
.brand{font-size:clamp(30px,9vw,40px);font-weight:700;line-height:1.2;letter-spacing:1.5px;background:linear-gradient(100deg,var(--g3) 25%,#fffbe6 45%,var(--g2) 55%,var(--g3) 75%);background-size:260% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 4s linear infinite}
@keyframes shine{to{background-position:-260% 0}}
.rule{display:flex;align-items:center;gap:10px;margin:14px 0 22px;color:var(--g2);font-size:10px}
.rule:before,.rule:after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--g2))}
.rule:after{transform:scaleX(-1)}
.step{display:none}
.step.on{display:block;animation:in .5s cubic-bezier(.2,.8,.2,1)}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
h2{font-size:clamp(19px,5.6vw,23px);font-weight:400;color:#fff;line-height:1.6;margin-bottom:18px;letter-spacing:.3px}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;margin:10px 0;padding:15px 12px;border-radius:12px;border:1px solid #f0c15a88;background:#ffffff0a;color:var(--g1);font:inherit;font-size:18px;letter-spacing:.8px;cursor:pointer;text-decoration:none;transition:transform .15s,background .25s,color .25s,box-shadow .25s}
.btn:hover,.btn:focus-visible{background:linear-gradient(135deg,var(--g1),var(--g2) 55%,var(--g3));color:#20140a;box-shadow:0 0 24px #f0c15a77;outline:none}
.btn:active{transform:scale(.98)}
.mgr{padding:16px 14px;margin:12px 0;border-radius:14px;border:1px solid #f0c15a55;background:#ffffff08}
.mgr b{display:block;font-size:24px;font-weight:600;color:#fff;letter-spacing:1px}
.mgr small{display:block;direction:ltr;color:var(--g2);font-size:15px;letter-spacing:1.5px;margin:4px 0 12px}
.wa{margin:0;border:0;background:linear-gradient(135deg,#34e27f,#12a35a);color:#03200f;font-weight:700;font-family:system-ui,sans-serif;font-size:16px}
.wa:hover,.wa:focus-visible{background:linear-gradient(135deg,#7dffb0,#1fc46d);color:#03200f;box-shadow:0 0 24px #34e27f88}
.wa svg{width:20px;height:20px;fill:currentColor}
.back{background:none;border:0;color:var(--g2);font:inherit;font-size:15px;margin-top:10px;padding:8px;cursor:pointer}
[dir=rtl] .btn{flex-direction:row-reverse}
@keyframes bob{0%,100%{translate:0 0}50%{translate:0 -6px}}
.btn,.back,.mgr b{animation:bob 2.4s ease-in-out infinite}
.step>:nth-child(2){animation-delay:-.3s}.step>:nth-child(3){animation-delay:-.9s}.step>:nth-child(4){animation-delay:-1.5s}.step>:nth-child(5){animation-delay:-2s}
.mgr:nth-of-type(1) b{animation-delay:-.2s}.mgr:nth-of-type(1) .wa{animation-delay:-.7s}.mgr:nth-of-type(2) b{animation-delay:-1.2s}.mgr:nth-of-type(2) .wa{animation-delay:-1.7s}.mgr:nth-of-type(3) b{animation-delay:-.5s}.mgr:nth-of-type(3) .wa{animation-delay:-1s}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div class="bg"></div><div class="veil"></div>
<main>
 <div class="panel">
  <div class="brand">Fano Group Chat</div>
  <div class="rule">&#9670;</div>
  <section class="step on" id="s1">
    <h2>Choose your language<br>اپنی زبان منتخب کریں<br>选择语言</h2>
    <button class="btn" data-l="en">English</button>
    <button class="btn" data-l="ur">اردو</button>
    <button class="btn" data-l="zh">中文</button>
  </section>
  <section class="step" id="s2">
    <h2 id="q"></h2>
    <button class="btn" data-r="0" id="r0"></button>
    <button class="btn" data-r="1" id="r1"></button>
    <button class="btn" data-r="2" id="r2"></button>
    <button class="back" id="b2"></button>
  </section>
  <section class="step" id="s3">
    <h2 id="m"></h2>
    <div class="mgr"><b>BossMan🇵🇰</b><small>+92 301 4251556</small><a class="btn wa" data-p="923014251556" target="_blank" rel="noopener"><svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 0 0-8.600 15.100L2 22l5-1.300A10 10 0 1 0 12 2Zm4.500 13.500c-.2.600-1.200 1.100-1.700 1.200-.5.100-1 .1-3.200-.8-2.600-1.200-4.200-3.800-4.300-4-.1-.2-1-1.300-1-2.500s.6-1.800.9-2c.2-.2.500-.3.700-.3h.5c.2 0 .4 0 .6.500l.8 1.800c.1.200.1.400 0 .5l-.4.600c-.1.200-.3.300-.1.600.6 1 1.400 1.800 2.400 2.300.3.200.5.100.6-.1l.7-.9c.2-.2.400-.2.600-.1l1.800.9c.2.100.4.200.4.300.1.200.1.600-.1 1Z"/></svg><span class="wt"></span></a></div>
    <div class="mgr"><b>Usama</b><small>+92 343 0777713</small><a class="btn wa" data-p="923430777713" target="_blank" rel="noopener"><svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 0 0-8.600 15.100L2 22l5-1.300A10 10 0 1 0 12 2Zm4.500 13.500c-.2.600-1.200 1.100-1.700 1.200-.5.100-1 .1-3.200-.8-2.600-1.200-4.200-3.800-4.300-4-.1-.2-1-1.300-1-2.500s.6-1.800.9-2c.2-.2.500-.3.700-.3h.5c.2 0 .4 0 .6.500l.8 1.800c.1.200.1.400 0 .5l-.4.600c-.1.200-.3.300-.1.600.6 1 1.400 1.800 2.400 2.300.3.200.5.100.6-.1l.7-.9c.2-.2.400-.2.600-.1l1.800.9c.2.100.4.200.4.300.1.200.1.600-.1 1Z"/></svg><span class="wt"></span></a></div>
    <div class="mgr"><b>Rehan</b><small>+92 336 1360007</small><a class="btn wa" data-p="923361360007" target="_blank" rel="noopener"><svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 0 0-8.600 15.100L2 22l5-1.300A10 10 0 1 0 12 2Zm4.500 13.500c-.2.600-1.200 1.100-1.700 1.200-.5.100-1 .1-3.200-.8-2.600-1.200-4.200-3.800-4.300-4-.1-.2-1-1.300-1-2.500s.6-1.800.9-2c.2-.2.500-.3.700-.3h.5c.2 0 .4 0 .6.500l.8 1.800c.1.200.1.400 0 .5l-.4.600c-.1.200-.3.300-.1.600.6 1 1.400 1.800 2.400 2.300.3.200.5.100.6-.1l.7-.9c.2-.2.400-.2.600-.1l1.800.9c.2.100.4.200.4.300.1.200.1.600-.1 1Z"/></svg><span class="wt"></span></a></div>
    <button class="back" id="b3"></button>
  </section>
 </div>
</main>
<script>
var T={
en:{q:"What do you want to become?",r:["Coinseller","Agency","Both (Seller & Agency)"],m:"Contact a manager",wa:"WhatsApp",b:"\u2190 Back",msg:"Hello, I want to become: "},
ur:{q:"آپ کیا بننا چاہتے ہیں؟",r:["کوائن سیلر","ایجنسی","دونوں (سیلر اور ایجنسی)"],m:"مینیجر سے رابطہ کریں",wa:"واٹس ایپ",b:"واپس \u2192",msg:"السلام علیکم، میں بننا چاہتا ہوں: "},
zh:{q:"您想成为什么？",r:["币商","公会","两者都要（币商和公会）"],m:"联系经理",wa:"WhatsApp",b:"\u2190 返回",msg:"您好，我想成为："}
};
var L="en",R=0,$=function(i){return document.getElementById(i)};
function show(n){["s1","s2","s3"].forEach(function(s){$(s).classList.toggle("on",s==n)})}
function setLang(l){L=l;var t=T[l];document.documentElement.lang=l;document.body.dir=l=="ur"?"rtl":"ltr";
$("q").textContent=t.q;$("m").textContent=t.m;$("b2").textContent=t.b;$("b3").textContent=t.b;
for(var i=0;i<3;i++)$("r"+i).textContent=t.r[i];
document.querySelectorAll(".wt").forEach(function(a){a.textContent=t.wa})}
document.querySelectorAll("[data-l]").forEach(function(b){b.onclick=function(){setLang(b.dataset.l);show("s2")}});
document.querySelectorAll("[data-r]").forEach(function(b){b.onclick=function(){R=+b.dataset.r;var t=T[L];
document.querySelectorAll(".wa").forEach(function(a){a.href="https://wa.me/"+a.dataset.p+"?text="+encodeURIComponent(t.msg+t.r[R])});show("s3")}});
$("b2").onclick=function(){show("s1")};$("b3").onclick=function(){show("s2")};
setLang("en");
</script>
</body>
</html>
